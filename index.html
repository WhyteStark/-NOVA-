<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Data</title>

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 4px;
      margin: 25px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9aa4b2;
      margin-bottom: 25px;
    }

    .card {
      background: #121821;
      border: 1px solid #202a36;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #c7d0db;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303b48;
      background: #0b1016;
      color: white;
      outline: none;
      margin-bottom: 16px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      border-color: white;
    }

    .networks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .network {
      padding: 15px;
      background: #18212c;
      border: 1px solid #293543;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .network:hover {
      background: #202c39;
    }

    .network.selected {
      border: 2px solid white;
      background: #202c39;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 600px;
      overflow-y: auto;
    }

    .plan {
      padding: 15px 12px;
      background: #18212c;
      border: 1px solid #293543;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .plan:hover {
      background: #202c39;
    }

    .plan.selected {
      border: 2px solid white;
      background: #202c39;
    }

    .plan-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .plan-duration {
      color: #9aa4b2;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .plan-price {
      font-size: 15px;
      font-weight: bold;
    }

    .plans-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #9aa4b2;
      padding: 30px 10px;
    }

    .summary {
      background: #0d131a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
      color: #b8c2ce;
    }

    .summary-row span:last-child {
      text-align: right;
      color: white;
    }

    .summary-row.total {
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #293543;
    }

    .buy-button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      background: white;
      color: #0b0f14;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .buy-button:hover {
      opacity: 0.9;
    }

    .buy-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #12301e;
      color: #7ff0a5;
    }

    .error {
      background: #351719;
      color: #ff9292;
    }

    .loading {
      background: #17202a;
      color: #cbd5df;
    }

    .footer {
      text-align: center;
      color: #66717e;
      font-size: 12px;
      margin: 25px 0;
    }

    .small {
      color: #7f8b99;
      font-size: 12px;
      margin-top: -8px;
      margin-bottom: 12px;
    }

    @media (max-width: 450px) {
      body {
        padding: 12px;
      }

      .plans {
        grid-template-columns: 1fr 1fr;
      }

      .plan {
        padding: 13px 10px;
      }

      .plan-name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOVA</div>

    <div class="subtitle">
      Fast and simple data purchase
    </div>

    <!-- CUSTOMER DETAILS -->
    <div class="card">

      <h2>Customer Details</h2>

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        inputmode="numeric"
        autocomplete="tel"
      >

    </div>


    <!-- NETWORK -->
    <div class="card">

      <h2>Choose Network</h2>

      <div class="networks">

        <button
          type="button"
          class="network"
          onclick="selectNetwork(this, 'MTN')"
        >
          MTN
        </button>

        <button
          type="button"
          class="network"
          onclick="selectNetwork(this, 'Airtel')"
        >
          Airtel
        </button>

        <button
          type="button"
          class="network"
          onclick="selectNetwork(this, 'Glo')"
        >
          Glo
        </button>

        <button
          type="button"
          class="network"
          onclick="selectNetwork(this, '9mobile')"
        >
          9mobile
        </button>

      </div>

    </div>


    <!-- DATA PLANS -->
    <div class="card">

      <h2>Select Data Bundle</h2>

      <div class="small">
        Choose a network above to load available plans.
      </div>

      <div
        class="plans"
        id="plans"
      >

        <div class="plans-empty">
          Select a network to load data plans.
        </div>

      </div>


      <!-- ORDER SUMMARY -->
      <div class="summary">

        <div class="summary-row">
          <span>Network</span>

          <span id="summaryNetwork">
            Not selected
          </span>
        </div>

        <div class="summary-row">
          <span>Bundle</span>

          <span id="summaryBundle">
            Not selected
          </span>
        </div>

        <div class="summary-row">
          <span>Validity</span>

          <span id="summaryDuration">
            Not selected
          </span>
        </div>

        <div class="summary-row total">
          <span>Total</span>

          <span id="summaryAmount">
            ₦0
          </span>
        </div>

      </div>


      <button
        type="button"
        class="buy-button"
        id="buyButton"
        onclick="buyBundle()"
      >
        Buy Data
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </div>


    <div class="footer">
      © 2026 NOVA. All rights reserved.
    </div>

  </div>


  <script>

    /*
    |--------------------------------------------------------------------------
    | NOVA CONFIGURATION
    |--------------------------------------------------------------------------
    */

    const BACKEND_URL =
      "https://nova-backend-fh5p.onrender.com";

    const PAYSTACK_PUBLIC_KEY =
      "pk_test_7ede74ad6f139b9b920adb0ae469613cffdd1f6f";


    /*
    |--------------------------------------------------------------------------
    | STATE
    |--------------------------------------------------------------------------
    */

    let selectedNetwork = null;

    let selectedPlan = null;

    let selectedPlanIndex = null;

    let networkPlans = [];


    /*
    |--------------------------------------------------------------------------
    | FORMAT NAIRA
    |--------------------------------------------------------------------------
    */

    function formatNaira(amount) {

      return "₦" +
        Number(amount || 0).toLocaleString(
          "en-NG"
        );

    }


    /*
    |--------------------------------------------------------------------------
    | MESSAGE
    |--------------------------------------------------------------------------
    */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className = "message";

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT NETWORK
    |--------------------------------------------------------------------------
    */

    async function selectNetwork(
      element,
      network
    ) {

      document
        .querySelectorAll(".network")
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      element.classList.add("selected");


      selectedNetwork =
        network;


      selectedPlan =
        null;


      selectedPlanIndex =
        null;


      networkPlans =
        [];


      document.getElementById(
        "summaryNetwork"
      ).textContent =
        network;


      document.getElementById(
        "summaryBundle"
      ).textContent =
        "Not selected";


      document.getElementById(
        "summaryDuration"
      ).textContent =
        "Not selected";


      document.getElementById(
        "summaryAmount"
      ).textContent =
        "₦0";


      await loadPlans(network);

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD PLANS FROM DEPLOYED BACKEND
    |--------------------------------------------------------------------------
    |
    | This is the important part.
    |
    | The frontend does NOT hard-code the plans.
    |
    | It loads them from:
    |
    | https://nova-backend-fh5p.onrender.com/api/plans
    |
    |--------------------------------------------------------------------------
    */

    async function loadPlans(network) {

      const plansContainer =
        document.getElementById("plans");


      plansContainer.innerHTML =
        '<div class="plans-empty">Loading plans...</div>';


      showMessage(
        "Loading " + network + " data plans...",
        "loading"
      );


      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/plans?network=" +
            encodeURIComponent(network)
          );


        if (!response.ok) {

          throw new Error(
            "Backend returned HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "NOVA PLANS RESPONSE:",
          data
        );


        if (
          !data.success ||
          !Array.isArray(data.plans)
        ) {

          throw new Error(
            "No valid plans were returned by NOVA."
          );

        }


        networkPlans =
          data.plans;


        renderPlans(
          networkPlans
        );


        clearMessage();

      }

      catch(error) {

        console.error(
          "PLAN LOADING ERROR:",
          error
        );


        plansContainer.innerHTML =
          '<div class="plans-empty">' +
          'Unable to load plans.<br><br>' +
          'Please try again.' +
          '</div>';


        showMessage(
          "Could not load " +
          network +
          " plans. Check that the NOVA backend is online.",
          "error"
        );

      }

    }


    /*
    |--------------------------------------------------------------------------
    | RENDER PLANS
    |--------------------------------------------------------------------------
    */

    function renderPlans(plans) {

      const container =
        document.getElementById("plans");


      container.innerHTML = "";


      if (!plans.length) {

        container.innerHTML =
          '<div class="plans-empty">' +
          'No plans available for this network.' +
          '</div>';

        return;

      }


      plans.forEach(
        function(plan, index) {

          const button =
            document.createElement("button");


          button.type =
            "button";


          button.className =
            "plan";


          button.onclick =
            function() {

              selectPlan(
                button,
                plan,
                index
              );

            };


          const name =
            document.createElement("div");

          name.className =
            "plan-name";

          name.textContent =
            plan.name;


          const duration =
            document.createElement("div");

          duration.className =
            "plan-duration";

          duration.textContent =
            plan.duration;


          const price =
            document.createElement("div");

          price.className =
            "plan-price";

          price.textContent =
            formatNaira(
              plan.price
            );


          button.appendChild(name);

          button.appendChild(duration);

          button.appendChild(price);


          container.appendChild(button);

        }
      );

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT PLAN
    |--------------------------------------------------------------------------
    */

    function selectPlan(
      element,
      plan,
      index
    ) {

      document
        .querySelectorAll(".plan")
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      element.classList.add(
        "selected"
      );


      selectedPlan =
        plan;


      /*
      |--------------------------------------------------------------------------
      | VERY IMPORTANT
      |
      | This index matches the backend DATA_PLANS[network][index].
      |--------------------------------------------------------------------------
      */

      selectedPlanIndex =
        index;


      document.getElementById(
        "summaryNetwork"
      ).textContent =
        selectedNetwork;


      document.getElementById(
        "summaryBundle"
      ).textContent =
        plan.name;


      document.getElementById(
        "summaryDuration"
      ).textContent =
        plan.duration;


      document.getElementById(
        "summaryAmount"
      ).textContent =
        formatNaira(
          plan.price
        );


      clearMessage();

    }


    /*
    |--------------------------------------------------------------------------
    | CHECK BACKEND
    |--------------------------------------------------------------------------
    */

    async function checkBackend() {

      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/health"
          );


        const data =
          await response.json();


        console.log(
          "NOVA BACKEND:",
          data
        );

      }

      catch(error) {

        console.error(
          "NOVA BACKEND CONNECTION ERROR:",
          error
        );

      }

    }


    /*
    |--------------------------------------------------------------------------
    | INITIAL BACKEND CHECK
    |--------------------------------------------------------------------------
    */

    checkBackend();

</script>





<script>

    /*
    |--------------------------------------------------------------------------
    | BUY DATA
    |--------------------------------------------------------------------------
    */

    async function buyBundle() {

      clearMessage();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const button =
        document.getElementById(
          "buyButton"
        );


      /*
      |--------------------------------------------------------------------------
      | VALIDATION
      |--------------------------------------------------------------------------
      */

      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;

      }


      if (!phone) {

        showMessage(
          "Please enter the phone number that should receive the data.",
          "error"
        );

        return;

      }


      if (!selectedNetwork) {

        showMessage(
          "Please select a network.",
          "error"
        );

        return;

      }


      if (
        selectedPlanIndex === null ||
        !selectedPlan
      ) {

        showMessage(
          "Please select a data plan.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | PHONE VALIDATION
      |--------------------------------------------------------------------------
      */

      const cleanPhone =
        phone.replace(
          /\D/g,
          ""
        );


      if (
        !/^0\d{10}$/.test(
          cleanPhone
        )
      ) {

        showMessage(
          "Enter a valid Nigerian phone number, e.g. 08012345678.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | LOCK BUTTON
      |--------------------------------------------------------------------------
      */

      button.disabled =
        true;


      button.textContent =
        "Creating order...";


      showMessage(
        "Creating your NOVA order...",
        "loading"
      );


      try {

        /*
        |--------------------------------------------------------------------------
        | CREATE ORDER
        |--------------------------------------------------------------------------
        |
        | IMPORTANT:
        |
        | Your deployed server expects:
        |
        | network
        | phone
        | planIndex
        |
        |--------------------------------------------------------------------------
        */

        const orderResponse =
          await fetch(
            BACKEND_URL +
            "/api/order",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  network:
                    selectedNetwork,

                  phone:
                    cleanPhone,

                  planIndex:
                    selectedPlanIndex

                })

            }
          );


        const orderData =
          await orderResponse.json();


        console.log(
          "NOVA ORDER:",
          orderData
        );


        if (!orderResponse.ok) {

          throw new Error(
            orderData.error ||
            "Unable to create order."
          );

        }


        if (
          !orderData.success
        ) {

          throw new Error(
            orderData.error ||
            "Order creation failed."
          );

        }


        /*
        |--------------------------------------------------------------------------
        | ORDER CREATED
        |--------------------------------------------------------------------------
        */

        const requestId =
          orderData.order &&
          orderData.order.requestId
            ? orderData.order.requestId
            : "";


        showMessage(
          "Order created. Opening secure payment...",
          "loading"
        );


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK CHECK
        |--------------------------------------------------------------------------
        */

        if (
          typeof PaystackPop ===
          "undefined"
        ) {

          throw new Error(
            "Paystack could not be loaded."
          );

        }


        button.textContent =
          "Opening payment...";


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK
        |--------------------------------------------------------------------------
        */

        const handler =
          PaystackPop.setup({

            key:
              PAYSTACK_PUBLIC_KEY,

            email:
              email,

            amount:
              Number(
                selectedPlan.price
              ) * 100,

            currency:
              "NGN",


            /*
            |--------------------------------------------------------------------------
            | PAYMENT CALLBACK
            |--------------------------------------------------------------------------
            */

            callback:
              async function(
                response
              ) {

                console.log(
                  "PAYSTACK REFERENCE:",
                  response.reference
                );


                button.disabled =
                  true;


                button.textContent =
                  "Verifying payment...";


                showMessage(
                  "Payment received. Verifying transaction...",
                  "loading"
                );


                try {

                  /*
                  |--------------------------------------------------------------------------
                  | VERIFY PAYMENT
                  |--------------------------------------------------------------------------
                  */

                  const verifyResponse =
                    await fetch(
                      BACKEND_URL +
                      "/api/verify-payment/" +
                      encodeURIComponent(
                        response.reference
                      )
                    );


                  const verifyData =
                    await verifyResponse.json();


                  console.log(
                    "PAYSTACK VERIFICATION:",
                    verifyData
                  );


                  if (
                    !verifyResponse.ok
                  ) {

                    throw new Error(
                      verifyData.error ||
                      "Payment verification failed."
                    );

                  }


                  if (
                    verifyData.status !==
                    "success"
                  ) {

                    throw new Error(
                      "Payment was not confirmed."
                    );

                  }


                  /*
                  |--------------------------------------------------------------------------
                  | PAYMENT VERIFIED
                  |--------------------------------------------------------------------------
                  */

                  showMessage(
                    "Payment successful! Your " +
                    selectedPlan.name +
                    " order has been verified.",
                    "success"
                  );


                  button.textContent =
                    "Payment Successful";


                  /*
                  |--------------------------------------------------------------------------
                  | IMPORTANT
                  |
                  | We stop here for now.
                  |
                  | Delivery should only happen after
                  | successful server-side verification.
                  |
                  |--------------------------------------------------------------------------
                  */

                  console.log(
                    "VERIFIED ORDER:",
                    {
                      requestId:
                        requestId,

                      network:
                        selectedNetwork,

                      phone:
                        cleanPhone,

                      planIndex:
                        selectedPlanIndex,

                      reference:
                        response.reference
                    }
                  );

                }

                catch(error) {

                  console.error(
                    "VERIFICATION ERROR:",
                    error
                  );


                  showMessage(
                    error.message ||
                    "Unable to verify payment.",
                    "error"
                  );


                  button.disabled =
                    false;


                  button.textContent =
                    "Buy Data";

                }

              },


            /*
            |--------------------------------------------------------------------------
            | PAYSTACK CLOSED
            |--------------------------------------------------------------------------
            */

            onClose:
              function() {

                console.log(
                  "Paystack payment window closed."
                );


                button.disabled =
                  false;


                button.textContent =
                  "Buy Data";


                showMessage(
                  "Payment window closed. No payment was completed.",
                  "error"
                );

              }

          });


        handler.openIframe();

      }

      catch(error) {

        console.error(
          "NOVA PURCHASE ERROR:",
          error
        );


        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "Buy Data";

      }

    }

  </script>

</body>
</html>
