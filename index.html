<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Data</title>

  <!-- Paystack -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 4px;
      margin: 25px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9aa4b2;
      margin-bottom: 25px;
    }

    .card {
      background: #121821;
      border: 1px solid #202a36;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #c7d0db;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303b48;
      background: #0b1016;
      color: #fff;
      outline: none;
      margin-bottom: 16px;
      font-size: 15px;
    }

    input:focus {
      border-color: #fff;
    }

    .networks {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .network {
      padding: 15px;
      background: #18212c;
      border: 1px solid #293543;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
    }

    .network:hover {
      background: #202c39;
    }

    .network.selected {
      border: 2px solid #fff;
      background: #202c39;
    }

    .plans-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .plan-count {
      color: #7f8b99;
      font-size: 12px;
    }

    .bundles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .bundle {
      padding: 15px 10px;
      background: #18212c;
      border: 1px solid #293543;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .bundle:hover {
      background: #202c39;
    }

    .bundle.selected {
      border: 2px solid #fff;
      background: #202c39;
    }

    .bundle-name {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .bundle-duration {
      color: #8995a3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .bundle-price {
      color: #fff;
      font-size: 15px;
      font-weight: bold;
    }

    .loading-plans {
      grid-column: 1 / -1;
      text-align: center;
      color: #9aa4b2;
      padding: 25px 10px;
    }

    .empty-plans {
      grid-column: 1 / -1;
      text-align: center;
      color: #9aa4b2;
      padding: 25px 10px;
    }

    .summary {
      background: #0d131a;
      border-radius: 12px;
      padding: 15px;
      margin-top: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 9px;
      color: #b8c2ce;
    }

    .summary-row span:last-child {
      text-align: right;
      color: #fff;
    }

    .summary-row.total {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #293543;
    }

    .buy-button {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      color: #0b0f14;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .buy-button:hover {
      opacity: 0.9;
    }

    .buy-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #12301e;
      color: #7ff0a5;
    }

    .error {
      background: #351719;
      color: #ff9292;
    }

    .loading {
      background: #17202a;
      color: #cbd5df;
    }

    .footer {
      text-align: center;
      color: #66717e;
      font-size: 12px;
      margin: 25px 0;
    }

    @media (max-width: 420px) {
      body {
        padding: 12px;
      }

      .bundles {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOVA</div>

    <div class="subtitle">
      Fast and simple data purchase
    </div>


    <!-- CUSTOMER DETAILS -->
    <div class="card">

      <h2>Customer Details</h2>

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="08012345678"
        inputmode="numeric"
        autocomplete="tel"
      >

    </div>


    <!-- NETWORK -->
    <div class="card">

      <h2>Choose Network</h2>

      <div class="networks">

        <button
          type="button"
          class="network"
          data-network="MTN"
        >
          MTN
        </button>

        <button
          type="button"
          class="network"
          data-network="Airtel"
        >
          Airtel
        </button>

        <button
          type="button"
          class="network"
          data-network="Glo"
        >
          Glo
        </button>

        <button
          type="button"
          class="network"
          data-network="9mobile"
        >
          9mobile
        </button>

      </div>

    </div>


    <!-- DATA PLANS -->
    <div class="card">

      <div class="plans-header">

        <h2>Select Data Bundle</h2>

        <span
          id="planCount"
          class="plan-count"
        >
          0 plans
        </span>

      </div>

      <div
        id="bundles"
        class="bundles"
      >

        <div class="empty-plans">
          Select a network to load data plans.
        </div>

      </div>


      <!-- ORDER SUMMARY -->

      <div class="summary">

        <div class="summary-row">

          <span>
            Network
          </span>

          <span id="summaryNetwork">
            Not selected
          </span>

        </div>


        <div class="summary-row">

          <span>
            Bundle
          </span>

          <span id="summaryBundle">
            Not selected
          </span>

        </div>


        <div class="summary-row">

          <span>
            Validity
          </span>

          <span id="summaryDuration">
            -
          </span>

        </div>


        <div class="summary-row total">

          <span>
            Total
          </span>

          <span id="summaryAmount">
            ₦0
          </span>

        </div>

      </div>


      <button
        type="button"
        class="buy-button"
        id="buyButton"
      >
        Buy Data
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </div>


    <div class="footer">
      © 2026 NOVA. All rights reserved.
    </div>

  </div>


  <script>

    /*
    |--------------------------------------------------------------------------
    | NOVA CONFIGURATION
    |--------------------------------------------------------------------------
    */

    const BACKEND_URL =
      "https://nova-backend-fh5p.onrender.com";

    /*
    |--------------------------------------------------------------------------
    | IMPORTANT
    |--------------------------------------------------------------------------
    |
    | This is your Paystack TEST public key.
    |
    | Never put a Paystack SECRET KEY in this file.
    |
    */

    const PAYSTACK_PUBLIC_KEY =
      "pk_test_7ede74ad6f139b9b920adb0ae469613cffdd1f6f";


    /*
    |--------------------------------------------------------------------------
    | STATE
    |--------------------------------------------------------------------------
    */

    let selectedNetwork = null;

    let selectedPlan = null;

    let networkPlans = [];


    /*
    |--------------------------------------------------------------------------
    | ELEMENTS
    |--------------------------------------------------------------------------
    */

    const bundlesElement =
      document.getElementById("bundles");

    const planCountElement =
      document.getElementById("planCount");

    const summaryNetwork =
      document.getElementById("summaryNetwork");

    const summaryBundle =
      document.getElementById("summaryBundle");

    const summaryDuration =
      document.getElementById("summaryDuration");

    const summaryAmount =
      document.getElementById("summaryAmount");

    const buyButton =
      document.getElementById("buyButton");


    /*
    |--------------------------------------------------------------------------
    | MESSAGE
    |--------------------------------------------------------------------------
    */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message show " + type;
    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className = "message";
    }


    /*
    |--------------------------------------------------------------------------
    | FORMAT NAIRA
    |--------------------------------------------------------------------------
    */

    function formatNaira(amount) {

      return "₦" +
        Number(amount).toLocaleString(
          "en-NG"
        );
    }


    /*
    |--------------------------------------------------------------------------
    | LOAD PLANS
    |--------------------------------------------------------------------------
    |
    | Uses:
    |
    | GET /api/plans?network=MTN
    |
    | GET /api/plans?network=Glo
    |
    | GET /api/plans?network=Airtel
    |
    | GET /api/plans?network=9mobile
    |
    */

    async function loadPlans(network) {

      selectedPlan = null;

      networkPlans = [];

      summaryBundle.textContent =
        "Not selected";

      summaryDuration.textContent =
        "-";

      summaryAmount.textContent =
        "₦0";


      bundlesElement.innerHTML = `
        <div class="loading-plans">
          Loading ${network} plans...
        </div>
      `;

      planCountElement.textContent =
        "Loading...";


      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/plans?network=" +
            encodeURIComponent(network)
          );


        const data =
          await response.json();


        console.log(
          "NOVA PLANS:",
          data
        );


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Unable to load data plans."
          );

        }


        if (
          !data.success ||
          !Array.isArray(data.plans)
        ) {

          throw new Error(
            "Invalid plans response from NOVA backend."
          );

        }


        networkPlans =
          data.plans;


        renderPlans();


      }

      catch (error) {

        console.error(
          "PLAN LOAD ERROR:",
          error
        );


        bundlesElement.innerHTML = `
          <div class="empty-plans">
            Unable to load plans.<br>
            Please check your connection and try again.
          </div>
        `;

        planCountElement.textContent =
          "0 plans";

        showMessage(
          error.message ||
          "Unable to load data plans.",
          "error"
        );

      }

    }


    /*
    |--------------------------------------------------------------------------
    | RENDER PLANS
    |--------------------------------------------------------------------------
    */

    function renderPlans() {

      bundlesElement.innerHTML = "";


      if (!networkPlans.length) {

        bundlesElement.innerHTML = `
          <div class="empty-plans">
            No plans available for ${selectedNetwork}.
          </div>
        `;

        planCountElement.textContent =
          "0 plans";

        return;
      }


      planCountElement.textContent =
        networkPlans.length +
        " plans";


      networkPlans.forEach(
        function(plan, index) {

          const button =
            document.createElement("button");


          button.type = "button";

          button.className = "bundle";


          button.innerHTML = `

            <div class="bundle-name">
              ${escapeHtml(plan.name)}
            </div>

            <div class="bundle-duration">
              ${escapeHtml(plan.duration)}
            </div>

            <div class="bundle-price">
              ${formatNaira(plan.price)}
            </div>

          `;


          button.addEventListener(
            "click",
            function() {

              selectPlan(
                button,
                plan,
                index
              );

            }
          );


          bundlesElement.appendChild(
            button
          );

        }
      );

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT PLAN
    |--------------------------------------------------------------------------
    */

    function selectPlan(
      element,
      plan,
      index
    ) {

      document
        .querySelectorAll(".bundle")
        .forEach(
          function(button) {

            button.classList.remove(
              "selected"
            );

          }
        );


      element.classList.add(
        "selected"
      );


      /*
      | Keep the INDEX because the backend
      | expects planIndex.
      */

      selectedPlan = {

        index: index,

        name: plan.name,

        duration: plan.duration,

        price: Number(plan.price),

        productCode:
          plan.productCode,

        productId:
          plan.productId

      };


      summaryBundle.textContent =
        plan.name;


      summaryDuration.textContent =
        plan.duration;


      summaryAmount.textContent =
        formatNaira(plan.price);


      clearMessage();

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT NETWORK
    |--------------------------------------------------------------------------
    */

    document
      .querySelectorAll(".network")
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              document
                .querySelectorAll(".network")
                .forEach(
                  function(networkButton) {

                    networkButton.classList.remove(
                      "selected"
                    );

                  }
                );


              button.classList.add(
                "selected"
              );


              selectedNetwork =
                button.dataset.network;


              summaryNetwork.textContent =
                selectedNetwork;


              loadPlans(
                selectedNetwork
              );

            }
          );

        }
      );


    /*
    |--------------------------------------------------------------------------
    | BUY DATA
    |--------------------------------------------------------------------------
    */

    buyButton.addEventListener(
      "click",
      buyBundle
    );


    async function buyBundle() {

      clearMessage();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      /*
      |--------------------------------------------------------------------------
      | VALIDATION
      |--------------------------------------------------------------------------
      */

      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if (!email.includes("@")) {

        showMessage(
          "Please enter a valid email address.",
          "error"
        );

        return;
      }


      if (!phone) {

        showMessage(
          "Please enter the phone number that should receive the data.",
          "error"
        );

        return;
      }


      const cleanPhone =
        phone.replace(
          /\D/g,
          ""
        );


      if (
        cleanPhone.length !== 11 ||
        !cleanPhone.startsWith("0")
      ) {

        showMessage(
          "Please enter a valid Nigerian phone number.",
          "error"
        );

        return;
      }


      if (!selectedNetwork) {

        showMessage(
          "Please select a network.",
          "error"
        );

        return;
      }


      if (!selectedPlan) {

        showMessage(
          "Please select a data plan.",
          "error"
        );

        return;
      }


      /*
      |--------------------------------------------------------------------------
      | CHECK PAYSTACK
      |--------------------------------------------------------------------------
      */

      if (
        typeof PaystackPop ===
        "undefined"
      ) {

        showMessage(
          "Paystack failed to load. Please refresh the page.",
          "error"
        );

        return;
      }


      buyButton.disabled = true;

      buyButton.textContent =
        "Creating order...";


      showMessage(
        "Creating your NOVA order...",
        "loading"
      );


      try {

        /*
        |--------------------------------------------------------------------------
        | CREATE ORDER
        |--------------------------------------------------------------------------
        |
        | IMPORTANT:
        |
        | Your deployed backend expects:
        |
        | network
        | phone
        | planIndex
        |
        */

        const orderResponse =
          await fetch(
            BACKEND_URL +
            "/api/order",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  network:
                    selectedNetwork,

                  phone:
                    cleanPhone,

                  planIndex:
                    selectedPlan.index

                })

            }
          );


        const orderData =
          await orderResponse.json();


        console.log(
          "NOVA ORDER RESPONSE:",
          orderData
        );


        if (!orderResponse.ok) {

          throw new Error(
            orderData.error ||
            "Unable to create NOVA order."
          );

        }


        if (!orderData.success) {

          throw new Error(
            orderData.error ||
            "Order creation failed."
          );

        }


        /*
        |--------------------------------------------------------------------------
        | ORDER CREATED
        |----------------------------------------
