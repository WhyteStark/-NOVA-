<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA Data</title>

  <script src="https://js.paystack.co/v2/inline.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      font-size: 12px;
      color: #4ade80;
    }

    .hero {
      padding: 45px 20px 30px;
      text-align: center;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #999;
      font-size: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #aaa;
      margin-bottom: 8px;
      font-size: 14px;
    }

    select,
    input {
      width: 100%;
      padding: 15px;
      background: #080808;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    .bundle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0b0b;
      border: 1px solid #292929;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .bundle:active {
      transform: scale(0.98);
    }

    .bundle.selected {
      border-color: #4ade80;
      background: #122018;
    }

    .bundle strong {
      font-size: 16px;
    }

    .price {
      color: #4ade80;
      font-weight: bold;
    }

    #selected {
      display: none;
      margin: 15px 0;
      padding: 15px;
      background: #181818;
      border-radius: 10px;
      text-align: center;
      color: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NOVA</div>
  <div class="status">● ONLINE</div>
</header>

<section class="hero">
  <h1>Buy Data. Simply.</h1>
  <p>
    Fast, affordable data bundles.<br>
    Choose your network and get connected.
  </p>
</section>

<div class="container">

  <div class="card">

    <h2>Choose Network</h2>

    <select id="network">
      <option value="MTN">MTN</option>
      <option value="Airtel">Airtel</option>
      <option value="Glo">Glo</option>
      <option value="9mobile">9mobile</option>
    </select>

    <label>Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="08012345678"
      maxlength="11"
    >

  </div>

  <div class="card">

    <h2>Choose Data</h2>

    <div class="bundle"
         onclick="selectBundle(this, '500MB', 150)">
      <strong>500MB</strong>
      <span class="price">₦150</span>
    </div>

    <div class="bundle"
         onclick="selectBundle(this, '1GB', 300)">
      <strong>1GB</strong>
      <span class="price">₦300</span>
    </div>

    <div class="bundle"
         onclick="selectBundle(this, '2GB', 550)">
      <strong>2GB</strong>
      <span class="price">₦550</span>
    </div>

    <div class="bundle"
         onclick="selectBundle(this, '5GB', 1200)">
      <strong>5GB</strong>
      <span class="price">₦1,200</span>
    </div>

    <div id="selected"></div>

    <button onclick="buyData()">
      Continue
    </button>

    <p class="note">
      NOVA is currently in test mode.
      No real data will be delivered yet.
    </p>

  </div>

</div>

<footer>
  © 2026 NOVA Data. All rights reserved.
</footer>

<script>

  const PAYSTACK_PUBLIC_KEY =
    "pk_test_7ede74ad6f139b9b920adb0ae469613cffdd1f6f";

  let selectedBundle = null;

  function selectBundle(element, name, price) {

    document.querySelectorAll(".bundle").forEach(function(bundle) {
      bundle.classList.remove("selected");
    });

    element.classList.add("selected");

    selectedBundle = {
      name: name,
      price: price
    };

    const selected = document.getElementById("selected");

    selected.style.display = "block";

    selected.innerHTML =
      "Selected: <strong>" +
      name +
      "</strong> — ₦" +
      price.toLocaleString();
  }


  function buyData() {

    const phone =
      document.getElementById("phone").value;

    if (!selectedBundle) {
      alert("Please select a data bundle first.");
      return;
    }

    if (!/^[0-9]{11}$/.test(phone)) {
      alert(
        "Please enter a valid 11-digit Nigerian phone number."
      );
      return;
    }

    if (
      typeof PaystackPop === "undefined"
    ) {
      alert(
        "Paystack could not load. Please refresh the page."
      );
      return;
    }

    const network =
      document.getElementById("network").value;

    const handler =
      PaystackPop.setup({

        key: PAYSTACK_PUBLIC_KEY,

        email:
          "customer@example.com",

        amount:
          selectedBundle.price * 100,

        currency:
          "NGN",

        callback:
          function(response) {

            alert(
              "Payment successful!\n\n" +
              "Reference: " +
              response.reference
            );

          },

        onClose:
          function() {

            alert(
              "Payment window closed."
            );

          }

      });

    handler.openIframe();
  }

</script>

</body>
</html>
