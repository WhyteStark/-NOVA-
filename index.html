


  <script>

    /*
    |--------------------------------------------------------------------------
    | NOVA CONFIGURATION
    |--------------------------------------------------------------------------
    */

    const BACKEND_URL =
      "https://nova-backend-fh5p.onrender.com";

    const PAYSTACK_PUBLIC_KEY =
      "pk_test_7ede74ad6f139b9b920adb0ae469613cffdd1f6f";


    /*
    |--------------------------------------------------------------------------
    | STATE
    |--------------------------------------------------------------------------
    */

    let selectedNetwork = null;

    let selectedPlan = null;

    let selectedPlanIndex = null;

    let networkPlans = [];


    /*
    |--------------------------------------------------------------------------
    | FORMAT NAIRA
    |--------------------------------------------------------------------------
    */

    function formatNaira(amount) {

      return "₦" +
        Number(amount || 0).toLocaleString(
          "en-NG"
        );

    }


    /*
    |--------------------------------------------------------------------------
    | MESSAGE
    |--------------------------------------------------------------------------
    */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className = "message";

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT NETWORK
    |--------------------------------------------------------------------------
    */

    async function selectNetwork(
      element,
      network
    ) {

      document
        .querySelectorAll(".network")
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      element.classList.add("selected");


      selectedNetwork =
        network;


      selectedPlan =
        null;


      selectedPlanIndex =
        null;


      networkPlans =
        [];


      document.getElementById(
        "summaryNetwork"
      ).textContent =
        network;


      document.getElementById(
        "summaryBundle"
      ).textContent =
        "Not selected";


      document.getElementById(
        "summaryDuration"
      ).textContent =
        "Not selected";


      document.getElementById(
        "summaryAmount"
      ).textContent =
        "₦0";


      await loadPlans(network);

    }


    /*
    |--------------------------------------------------------------------------
    | LOAD PLANS FROM DEPLOYED BACKEND
    |--------------------------------------------------------------------------
    |
    | This is the important part.
    |
    | The frontend does NOT hard-code the plans.
    |
    | It loads them from:
    |
    | https://nova-backend-fh5p.onrender.com/api/plans
    |
    |--------------------------------------------------------------------------
    */

    async function loadPlans(network) {

      const plansContainer =
        document.getElementById("plans");


      plansContainer.innerHTML =
        '<div class="plans-empty">Loading plans...</div>';


      showMessage(
        "Loading " + network + " data plans...",
        "loading"
      );


      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/plans?network=" +
            encodeURIComponent(network)
          );


        if (!response.ok) {

          throw new Error(
            "Backend returned HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        console.log(
          "NOVA PLANS RESPONSE:",
          data
        );


        if (
          !data.success ||
          !Array.isArray(data.plans)
        ) {

          throw new Error(
            "No valid plans were returned by NOVA."
          );

        }


        networkPlans =
          data.plans;


        renderPlans(
          networkPlans
        );


        clearMessage();

      }

      catch(error) {

        console.error(
          "PLAN LOADING ERROR:",
          error
        );


        plansContainer.innerHTML =
          '<div class="plans-empty">' +
          'Unable to load plans.<br><br>' +
          'Please try again.' +
          '</div>';


        showMessage(
          "Could not load " +
          network +
          " plans. Check that the NOVA backend is online.",
          "error"
        );

      }

    }


    /*
    |--------------------------------------------------------------------------
    | RENDER PLANS
    |--------------------------------------------------------------------------
    */

    function renderPlans(plans) {

      const container =
        document.getElementById("plans");


      container.innerHTML = "";


      if (!plans.length) {

        container.innerHTML =
          '<div class="plans-empty">' +
          'No plans available for this network.' +
          '</div>';

        return;

      }


      plans.forEach(
        function(plan, index) {

          const button =
            document.createElement("button");


          button.type =
            "button";


          button.className =
            "plan";


          button.onclick =
            function() {

              selectPlan(
                button,
                plan,
                index
              );

            };


          const name =
            document.createElement("div");

          name.className =
            "plan-name";

          name.textContent =
            plan.name;


          const duration =
            document.createElement("div");

          duration.className =
            "plan-duration";

          duration.textContent =
            plan.duration;


          const price =
            document.createElement("div");

          price.className =
            "plan-price";

          price.textContent =
            formatNaira(
              plan.price
            );


          button.appendChild(name);

          button.appendChild(duration);

          button.appendChild(price);


          container.appendChild(button);

        }
      );

    }


    /*
    |--------------------------------------------------------------------------
    | SELECT PLAN
    |--------------------------------------------------------------------------
    */

    function selectPlan(
      element,
      plan,
      index
    ) {

      document
        .querySelectorAll(".plan")
        .forEach(function(button) {

          button.classList.remove(
            "selected"
          );

        });


      element.classList.add(
        "selected"
      );


      selectedPlan =
        plan;


      /*
      |--------------------------------------------------------------------------
      | VERY IMPORTANT
      |
      | This index matches the backend DATA_PLANS[network][index].
      |--------------------------------------------------------------------------
      */

      selectedPlanIndex =
        index;


      document.getElementById(
        "summaryNetwork"
      ).textContent =
        selectedNetwork;


      document.getElementById(
        "summaryBundle"
      ).textContent =
        plan.name;


      document.getElementById(
        "summaryDuration"
      ).textContent =
        plan.duration;


      document.getElementById(
        "summaryAmount"
      ).textContent =
        formatNaira(
          plan.price
        );


      clearMessage();

    }


    /*
    |--------------------------------------------------------------------------
    | CHECK BACKEND
    |--------------------------------------------------------------------------
    */

    async function checkBackend() {

      try {

        const response =
          await fetch(
            BACKEND_URL +
            "/api/health"
          );


        const data =
          await response.json();


        console.log(
          "NOVA BACKEND:",
          data
        );

      }

      catch(error) {

        console.error(
          "NOVA BACKEND CONNECTION ERROR:",
          error
        );

      }

    }


    /*
    |--------------------------------------------------------------------------
    | INITIAL BACKEND CHECK
    |--------------------------------------------------------------------------
    */

    checkBackend();

</script>





<script>

    /*
    |--------------------------------------------------------------------------
    | BUY DATA
    |--------------------------------------------------------------------------
    */

    async function buyBundle() {

      clearMessage();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const button =
        document.getElementById(
          "buyButton"
        );


      /*
      |--------------------------------------------------------------------------
      | VALIDATION
      |--------------------------------------------------------------------------
      */

      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;

      }


      if (!phone) {

        showMessage(
          "Please enter the phone number that should receive the data.",
          "error"
        );

        return;

      }


      if (!selectedNetwork) {

        showMessage(
          "Please select a network.",
          "error"
        );

        return;

      }


      if (
        selectedPlanIndex === null ||
        !selectedPlan
      ) {

        showMessage(
          "Please select a data plan.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | PHONE VALIDATION
      |--------------------------------------------------------------------------
      */

      const cleanPhone =
        phone.replace(
          /\D/g,
          ""
        );


      if (
        !/^0\d{10}$/.test(
          cleanPhone
        )
      ) {

        showMessage(
          "Enter a valid Nigerian phone number, e.g. 08012345678.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | LOCK BUTTON
      |--------------------------------------------------------------------------
      */

      button.disabled =
        true;


      button.textContent =
        "Creating order...";


      showMessage(
        "Creating your NOVA order...",
        "loading"
      );


      try {

        /*
        |--------------------------------------------------------------------------
        | CREATE ORDER
        |--------------------------------------------------------------------------
        |
        | IMPORTANT:
        |
        | Your deployed server expects:
        |
        | network
        | phone
        | planIndex
        |
        |--------------------------------------------------------------------------
        */

        const orderResponse =
          await fetch(
            BACKEND_URL +
            "/api/order",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  network:
                    selectedNetwork,

                  phone:
                    cleanPhone,

                  planIndex:
                    selectedPlanIndex

                })

            }
          );


        const orderData =
          await orderResponse.json();


        console.log(
          "NOVA ORDER:",
          orderData
        );


        if (!orderResponse.ok) {

          throw new Error(
            orderData.error ||
            "Unable to create order."
          );

        }


        if (
          !orderData.success
        ) {

          throw new Error(
            orderData.error ||
            "Order creation failed."
          );

        }


        /*
        |--------------------------------------------------------------------------
        | ORDER CREATED
        |--------------------------------------------------------------------------
        */

        const requestId =
          orderData.order &&
          orderData.order.requestId
            ? orderData.order.requestId
            : "";


        showMessage(
          "Order created. Opening secure payment...",
          "loading"
        );


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK CHECK
        |--------------------------------------------------------------------------
        */

        if (
          typeof PaystackPop ===
          "undefined"
        ) {

          throw new Error(
            "Paystack could not be loaded."
          );

        }


        button.textContent =
          "Opening payment...";


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK
        |--------------------------------------------------------------------------
        */

        const handler =
          PaystackPop.setup({

            key:
              PAYSTACK_PUBLIC_KEY,

            email:
              email,

            amount:
              Number(
                selectedPlan.price
              ) * 100,

            currency:
              "NGN",


            /*
            |--------------------------------------------------------------------------
            | PAYMENT CALLBACK
            |--------------------------------------------------------------------------
            */

            callback:
              async function(
                response
              ) {

                console.log(
                  "PAYSTACK REFERENCE:",
                  response.reference
                );


                button.disabled =
                  true;


                button.textContent =
                  "Verifying payment...";


                showMessage(
                  "Payment received. Verifying transaction...",
                  "loading"
                );


                try {

                  /*
                  |--------------------------------------------------------------------------
                  | VERIFY PAYMENT
                  |--------------------------------------------------------------------------
                  */

                  const verifyResponse =
                    await fetch(
                      BACKEND_URL +
                      "/api/verify-payment/" +
                      encodeURIComponent(
                        response.reference
                      )
                    );


                  const verifyData =
                    await verifyResponse.json();


                  console.log(
                    "PAYSTACK VERIFICATION:",
                    verifyData
                  );


                  if (
                    !verifyResponse.ok
                  ) {

                    throw new Error(
                      verifyData.error ||
                      "Payment verification failed."
                    );

                  }


                  if (
                    verifyData.status !==
                    "success"
                  ) {

                    throw new Error(
                      "Payment was not confirmed."
                    );

                  }


                  /*
                  |--------------------------------------------------------------------------
                  | PAYMENT VERIFIED
                  |--------------------------------------------------------------------------
                  */

                  showMessage(
                    "Payment successful! Your " +
                    selectedPlan.name +
                    " order has been verified.",
                    "success"
                  );


                  button.textContent =
                    "Payment Successful";


                  /*
                  |--------------------------------------------------------------------------
                  | IMPORTANT
                  |
                  | We stop here for now.
                  |
                  | Delivery should only happen after
                  | successful server-side verification.
                  |
                  |--------------------------------------------------------------------------
                  */

                  console.log(
                    "VERIFIED ORDER:",
                    {
                      requestId:
                        requestId,

                      network:
                        selectedNetwork,

                      phone:
                        cleanPhone,

                      planIndex:
                        selectedPlanIndex,

                      reference:
                        response.reference
                    }
                  );

                }

                catch(error) {

                  console.error(
                    "VERIFICATION ERROR:",
                    error
                  );


                  showMessage(
                    error.message ||
                    "Unable to verify payment.",
                    "error"
                  );


                  button.disabled =
                    false;


                  button.textContent =
                    "Buy Data";

                }

              },


            /*
            |--------------------------------------------------------------------------
            | PAYSTACK CLOSED
            |--------------------------------------------------------------------------
            */

            onClose:
              function() {

                console.log(
                  "Paystack payment window closed."
                );


                button.disabled =
                  false;


                button.textContent =
                  "Buy Data";


                showMessage(
                  "Payment window closed. No payment was completed.",
                  "error"
                );

              }

          });


        handler.openIframe();

      }

      catch(error) {

        console.error(
          "NOVA PURCHASE ERROR:",
          error
        );


        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "Buy Data";

      }

    }

  </script>

</body>
