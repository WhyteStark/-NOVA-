








<script>

    /*
    |--------------------------------------------------------------------------
    | BUY DATA
    |--------------------------------------------------------------------------
    */

    async function buyBundle() {

      clearMessage();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const button =
        document.getElementById(
          "buyButton"
        );


      /*
      |--------------------------------------------------------------------------
      | VALIDATION
      |--------------------------------------------------------------------------
      */

      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;

      }


      if (!phone) {

        showMessage(
          "Please enter the phone number that should receive the data.",
          "error"
        );

        return;

      }


      if (!selectedNetwork) {

        showMessage(
          "Please select a network.",
          "error"
        );

        return;

      }


      if (
        selectedPlanIndex === null ||
        !selectedPlan
      ) {

        showMessage(
          "Please select a data plan.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | PHONE VALIDATION
      |--------------------------------------------------------------------------
      */

      const cleanPhone =
        phone.replace(
          /\D/g,
          ""
        );


      if (
        !/^0\d{10}$/.test(
          cleanPhone
        )
      ) {

        showMessage(
          "Enter a valid Nigerian phone number, e.g. 08012345678.",
          "error"
        );

        return;

      }


      /*
      |--------------------------------------------------------------------------
      | LOCK BUTTON
      |--------------------------------------------------------------------------
      */

      button.disabled =
        true;


      button.textContent =
        "Creating order...";


      showMessage(
        "Creating your NOVA order...",
        "loading"
      );


      try {

        /*
        |--------------------------------------------------------------------------
        | CREATE ORDER
        |--------------------------------------------------------------------------
        |
        | IMPORTANT:
        |
        | Your deployed server expects:
        |
        | network
        | phone
        | planIndex
        |
        |--------------------------------------------------------------------------
        */

        const orderResponse =
          await fetch(
            BACKEND_URL +
            "/api/order",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  network:
                    selectedNetwork,

                  phone:
                    cleanPhone,

                  planIndex:
                    selectedPlanIndex

                })

            }
          );


        const orderData =
          await orderResponse.json();


        console.log(
          "NOVA ORDER:",
          orderData
        );


        if (!orderResponse.ok) {

          throw new Error(
            orderData.error ||
            "Unable to create order."
          );

        }


        if (
          !orderData.success
        ) {

          throw new Error(
            orderData.error ||
            "Order creation failed."
          );

        }


        /*
        |--------------------------------------------------------------------------
        | ORDER CREATED
        |--------------------------------------------------------------------------
        */

        const requestId =
          orderData.order &&
          orderData.order.requestId
            ? orderData.order.requestId
            : "";


        showMessage(
          "Order created. Opening secure payment...",
          "loading"
        );


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK CHECK
        |--------------------------------------------------------------------------
        */

        if (
          typeof PaystackPop ===
          "undefined"
        ) {

          throw new Error(
            "Paystack could not be loaded."
          );

        }


        button.textContent =
          "Opening payment...";


        /*
        |--------------------------------------------------------------------------
        | PAYSTACK
        |--------------------------------------------------------------------------
        */

        const handler =
          PaystackPop.setup({

            key:
              PAYSTACK_PUBLIC_KEY,

            email:
              email,

            amount:
              Number(
                selectedPlan.price
              ) * 100,

            currency:
              "NGN",


            /*
            |--------------------------------------------------------------------------
            | PAYMENT CALLBACK
            |--------------------------------------------------------------------------
            */

            callback:
              async function(
                response
              ) {

                console.log(
                  "PAYSTACK REFERENCE:",
                  response.reference
                );


                button.disabled =
                  true;


                button.textContent =
                  "Verifying payment...";


                showMessage(
                  "Payment received. Verifying transaction...",
                  "loading"
                );


                try {

                  /*
                  |--------------------------------------------------------------------------
                  | VERIFY PAYMENT
                  |--------------------------------------------------------------------------
                  */

                  const verifyResponse =
                    await fetch(
                      BACKEND_URL +
                      "/api/verify-payment/" +
                      encodeURIComponent(
                        response.reference
                      )
                    );


                  const verifyData =
                    await verifyResponse.json();


                  console.log(
                    "PAYSTACK VERIFICATION:",
                    verifyData
                  );


                  if (
                    !verifyResponse.ok
                  ) {

                    throw new Error(
                      verifyData.error ||
                      "Payment verification failed."
                    );

                  }


                  if (
                    verifyData.status !==
                    "success"
                  ) {

                    throw new Error(
                      "Payment was not confirmed."
                    );

                  }


                  /*
                  |--------------------------------------------------------------------------
                  | PAYMENT VERIFIED
                  |--------------------------------------------------------------------------
                  */

                  showMessage(
                    "Payment successful! Your " +
                    selectedPlan.name +
                    " order has been verified.",
                    "success"
                  );


                  button.textContent =
                    "Payment Successful";


                  /*
                  |--------------------------------------------------------------------------
                  | IMPORTANT
                  |
                  | We stop here for now.
                  |
                  | Delivery should only happen after
                  | successful server-side verification.
                  |
                  |--------------------------------------------------------------------------
                  */

                  console.log(
                    "VERIFIED ORDER:",
                    {
                      requestId:
                        requestId,

                      network:
                        selectedNetwork,

                      phone:
                        cleanPhone,

                      planIndex:
                        selectedPlanIndex,

                      reference:
                        response.reference
                    }
                  );

                }

                catch(error) {

                  console.error(
                    "VERIFICATION ERROR:",
                    error
                  );


                  showMessage(
                    error.message ||
                    "Unable to verify payment.",
                    "error"
                  );


                  button.disabled =
                    false;


                  button.textContent =
                    "Buy Data";

                }

              },


            /*
            |--------------------------------------------------------------------------
            | PAYSTACK CLOSED
            |--------------------------------------------------------------------------
            */

            onClose:
              function() {

                console.log(
                  "Paystack payment window closed."
                );


                button.disabled =
                  false;


                button.textContent =
                  "Buy Data";


                showMessage(
                  "Payment window closed. No payment was completed.",
                  "error"
                );

              }

          });


        handler.openIframe();

      }

      catch(error) {

        console.error(
          "NOVA PURCHASE ERROR:",
          error
        );


        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "Buy Data";

      }

    }

  </script>

</body>
</html>
