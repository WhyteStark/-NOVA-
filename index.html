<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NOVA — Data & Payments</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, #073b4c 0%, transparent 35%),
        linear-gradient(135deg, #020617, #06131f 55%, #001f2d);
      color: #fff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 30px 15px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      color: #38bdf8;
    }

    .tagline {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 14px;
    }

    .card {
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-bottom: 15px;
      font-size: 19px;
    }

    .networks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .network-btn {
      border: 1px solid #334155;
      background: #0f172a;
      color: #cbd5e1;
      padding: 14px 8px;
      border-radius: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .network-btn:hover {
      border-color: #38bdf8;
    }

    .network-btn.active {
      background: #075985;
      border-color: #38bdf8;
      color: white;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 12px;
    }

    .plan {
      background: #0b1220;
      border: 1px solid #263449;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .plan:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .plan.selected {
      border-color: #38bdf8;
      background: #082f49;
      box-shadow: 0 0 0 1px #38bdf8;
    }

    .plan-name {
      font-size: 20px;
      font-weight: 800;
    }

    .plan-duration {
      color: #94a3b8;
      margin-top: 5px;
      font-size: 12px;
    }

    .plan-price {
      color: #38bdf8;
      font-size: 17px;
      font-weight: bold;
      margin-top: 12px;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #cbd5e1;
      margin-bottom: 7px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #334155;
      outline: none;
      background: #020617;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .summary {
      background: #020617;
      border-radius: 15px;
      padding: 16px;
      margin-top: 10px;
      line-height: 1.8;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #172033;
      padding: 5px 0;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-label {
      color: #94a3b8;
    }

    .summary-value {
      font-weight: bold;
      text-align: right;
    }

    .pay-btn {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .pay-btn:hover {
      background: #0369a1;
    }

    .pay-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
      white-space: pre-wrap;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(22, 163, 74, 0.15);
      border: 1px solid #16a34a;
      color: #86efac;
    }

    .message.error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid #dc2626;
      color: #fca5a5;
    }

    .message.info {
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid #0284c7;
      color: #7dd3fc;
    }

    .loading {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #475569;
      font-size: 12px;
      padding: 25px 10px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .networks {
        grid-template-columns: repeat(2, 1fr);
      }

      .plans {
        grid-template-columns: repeat(2, 1fr);
      }

      .logo {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <div class="logo">NOVA</div>
      <div class="tagline">
        Simple. Fast. Nigerian.
      </div>
    </header>

    <!-- NETWORK -->
    <section class="card">

      <h2>1. Choose Network</h2>

      <div class="networks">

        <button
          class="network-btn"
          data-network="MTN"
          onclick="selectNetwork('MTN')"
        >
          MTN
        </button>

        <button
          class="network-btn"
          data-network="Airtel"
          onclick="selectNetwork('Airtel')"
        >
          Airtel
        </button>

        <button
          class="network-btn"
          data-network="Glo"
          onclick="selectNetwork('Glo')"
        >
          Glo
        </button>

        <button
          class="network-btn"
          data-network="9mobile"
          onclick="selectNetwork('9mobile')"
        >
          9mobile
        </button>

      </div>

    </section>

    <!-- PLANS -->
    <section class="card">

      <h2>2. Choose Data Plan</h2>

      <div id="plans" class="plans">
        <div class="empty">
          Choose a network first.
        </div>
      </div>

    </section>

    <!-- CUSTOMER -->
    <section class="card">

      <h2>3. Your Details</h2>

      <div class="input-group">

        <label for="phone">
          Phone number receiving the data
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          placeholder="08012345678"
          maxlength="14"
        >

      </div>

      <div class="input-group">

        <label for="email">
          Email address
        </label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
        >

      </div>

    </section>

    <!-- SUMMARY -->
    <section class="card">

      <h2>4. Order Summary</h2>

      <div class="summary">

        <div class="summary-row">
          <span class="summary-label">Network</span>
          <span
            class="summary-value"
            id="summaryNetwork"
          >
            —
          </span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Bundle</span>
          <span
            class="summary-value"
            id="summaryBundle"
          >
            —
          </span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Duration</span>
          <span
            class="summary-value"
            id="summaryDuration"
          >
            —
          </span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Phone</span>
          <span
            class="summary-value"
            id="summaryPhone"
          >
            —
          </span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Price</span>
          <span
            class="summary-value"
            id="summaryPrice"
          >
            ₦0
          </span>
        </div>

      </div>

      <button
        id="payButton"
        class="pay-btn"
        onclick="createOrderAndPay()"
        disabled
      >
        Pay & Buy Data
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </section>

    <footer>
      © 2026 NOVA. All rights reserved.
    </footer>

  </div>

<script>

  /*
  ======================================================
  CONFIGURATION
  ======================================================
  */

  const BACKEND_URL =
    "https://nova-backend-fh5p.onrender.com";

  /*
  ======================================================
  STATE
  ======================================================
  */

  let selectedNetwork = null;
  let selectedPlan = null;
  let currentPlans = [];

  /*
  ======================================================
  DOM
  ======================================================
  */

  const plansContainer =
    document.getElementById("plans");

  const payButton =
    document.getElementById("payButton");

  const messageBox =
    document.getElementById("message");

  /*
  ======================================================
  MESSAGE
  ======================================================
  */

  function showMessage(message, type = "info") {

    messageBox.textContent = message;

    messageBox.className =
      `message show ${type}`;

  }

  function clearMessage() {

    messageBox.textContent = "";

    messageBox.className =
      "message";

  }

  /*
  ======================================================
  SELECT NETWORK
  ======================================================
  */

  async function selectNetwork(network) {

    selectedNetwork = network;
    selectedPlan = null;

    document
      .querySelectorAll(".network-btn")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.network === network
        );

      });

    updateSummary();

    await loadPlans(network);
  }

  /*
  ======================================================
  LOAD PLANS
  ======================================================
  */

  async function loadPlans(network) {

    plansContainer.innerHTML =
      `<div class="loading">Loading plans...</div>`;

    clearMessage();

    try {

      const response = await fetch(
        `${BACKEND_URL}/api/plans?network=${encodeURIComponent(network)}`
      );

      const data = await response.json();

      if (!response.ok || !data.success) {

        throw new Error(
          data.message || "Unable to load plans."
        );

      }

      currentPlans = data.plans || [];

      renderPlans();

    } catch (error) {

      console.error(error);

      plansContainer.innerHTML =
        `<div class="empty">
          Unable to load data plans.
        </div>`;

      showMessage(
        "Could not connect to NOVA backend.\n\n" +
        error.message,
        "error"
      );

    }
  }

  /*
  ======================================================
  RENDER PLANS
  ======================================================
  */

  function renderPlans() {

    if (!currentPlans.length) {

      plansContainer.innerHTML =
        `<div class="empty">
          No plans available.
        </div>`;

      return;
    }

    plansContainer.innerHTML =
      currentPlans
        .map((plan, index) => {

          return `
            <div
              class="plan"
              data-index="${index}"
              onclick="selectPlan(${index})"
            >

              <div class="plan-name">
                ${escapeHtml(plan.name)}
              </div>

              <div class="plan-duration">
                ${escapeHtml(plan.duration)}
              </div>

              <div class="plan-price">
                ₦${Number(plan.price).toLocaleString()}
              </div>

            </div>
          `;

        })
        .join("");

  }

  /*
  ======================================================
  SELECT PLAN
  ======================================================
  */

  function selectPlan(index) {

    selectedPlan =
      currentPlans[index] || null;

    document
      .querySelectorAll(".plan")
      .forEach(card => {

        card.classList.toggle(
          "selected",
          Number(card.dataset.index) === index
        );

      });

    updateSummary();
  }

  /*
  ======================================================
  SUMMARY
  ======================================================
  */

  function updateSummary() {

    document.getElementById("summaryNetwork")
      .textContent =
      selectedNetwork || "—";

    document.getElementById("summaryBundle")
      .textContent =
      selectedPlan
        ? selectedPlan.name
        : "—";

    document.getElementById("summaryDuration")
      .textContent =
      selectedPlan
        ? selectedPlan.duration
        : "—";

    document.getElementById("summaryPhone")
      .textContent =
      document.getElementById("phone").value ||
      "—";

    document.getElementById("summaryPrice")
      .textContent =
      selectedPlan
        ? `₦${Number(selectedPlan.price).toLocaleString()}`
        : "₦0";

    payButton.disabled =
      !selectedNetwork ||
      !selectedPlan ||
      !document.getElementById("phone").value.trim() ||
      !document.getElementById("email").value.trim();

  }

  /*
  ======================================================
  INPUT EVENTS
  ======================================================
  */

  document
    .getElementById("phone")
    .addEventListener("input", updateSummary);

  document
    .getElementById("email")
    .addEventListener("input", updateSummary);

  /*
  ======================================================
  CREATE ORDER + PAY
  ======================================================
  */

  async function createOrderAndPay() {

    clearMessage();

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim();

    if (!selectedNetwork) {

      showMessage(
        "Please select a network.",
        "error"
      );

      return;
    }

    if (!selectedPlan) {

      showMessage(
        "Please select a data plan.",
        "error"
      );

      return;
    }

    if (!isValidPhone(phone)) {

      showMessage(
        "Please enter a valid Nigerian phone number.",
        "error"
      );

      return;
    }

    if (!isValidEmail(email)) {

      showMessage(
        "Please enter a valid email address.",
        "error"
      );

      return;
    }

    payButton.disabled = true;

    payButton.textContent =
      "Creating secure payment...";

    try {

      /*
        IMPORTANT:
        We send planIndex, not price.

        The backend determines the real price.
      */

      const planIndex =
        currentPlans.findIndex(
          plan =>
            plan.index === selectedPlan.index
        );

      if (planIndex < 0) {

        throw new Error(
          "Selected plan could not be identified."
        );

      }

      const response = await fetch(
        `${BACKEND_URL}/api/order`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            network: selectedNetwork,
            phone,
            email,
            planIndex
          })
        }
      );

      const data =
        await response.json();

      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Unable to create order."
        );

      }

      if (
        !data.payment ||
        !data.payment.authorization_url
      ) {

        throw new Error(
          "Paystack authorization URL was not returned."
        );

      }

      /*
        Save order information so that after Paystack
        redirects back to NOVA, we can verify and deliver.
      */

      localStorage.setItem(
        "nova_pending_order",
        JSON.stringify({
          orderId: data.order.orderId,
          requestId: data.order.requestId,
          network: data.order.network,
          phone: data.order.phone,
          planIndex: data.order.planIndex
        })
      );

      /*
        Redirect to Paystack checkout.
      */

      window.location.href =
        data.payment.authorization_url;

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Payment initialization failed.",
        "error"
      );

      payButton.disabled = false;

      payButton.textContent =
        "Pay & Buy Data";
    }
  }

  /*
  ======================================================
  HANDLE PAYSTACK RETURN
  ======================================================
  */

  async function handlePaymentReturn() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const reference =
      params.get("reference");

    if (!reference) {
      return;
    }

    showMessage(
      "Payment returned to NOVA.\nVerifying payment...",
      "info"
    );

    try {

      const response = await fetch(
        `${BACKEND_URL}/api/verify-payment/${encodeURIComponent(reference)}`
      );

      const data =
        await response.json();

      if (!response.ok || !data.success) {

        throw new Error(
          data.message ||
          "Payment verification failed."
        );

      }

      if (!data.paid) {

        showMessage(
          `Payment status: ${data.status || "unknown"}\n\n` +
          (data.message || "Payment was not successful."),
          "error"
        );

        localStorage.removeItem(
          "nova_pending_order"
        );

        return;
      }

      /*
        Payment is confirmed.
        Now deliver the data.
      */

      showMessage(
        "Payment confirmed.\nDelivering your data...",
        "info"
      );

      await deliverData(reference);

    } catch (error) {

      console.error(error);

      showMessage(
        "Payment verification failed.\n\n" +
        error.message,
        "error"
      );

    } finally {

      /*
        Remove reference from URL.
      */

      const cleanUrl =
        window.location.origin +
        window.location.pathname;

      window.history.replaceState(
        {},
        document.title,
        cleanUrl
      );

    }
  }

  /*
  ======================================================
  DELIVER DATA
  ======================================================
  */

  async function deliverData(reference) {

    const saved =
      localStorage.getItem(
        "nova_pending_order"
      );

    if (!saved) {

      throw new Error(
        "Order information was not found on this device."
      );

    }

    const pending =
      JSON.parse(saved);

    const response = await fetch(
      `${BACKEND_URL}/api/deliver`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          network: pending.network,
          phone: pending.phone,
          planIndex: pending.planIndex,
          requestId: pending.requestId
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "Data delivery failed."
      );

    }

    if (data.alreadyDelivered) {

      showMessage(
        "Your data has already been delivered successfully.",
        "success"
      );

    } else {

      showMessage(
        "🎉 Payment successful!\n\n" +
        `${pending.network} data has been submitted for ` +
        `${pending.phone}.\n\n` +
        `Order ID: ${pending.orderId}`,
        "success"
      );

    }

    localStorage.removeItem(
      "nova_pending_order"
    );
  }

  /*
  ==============
  VALIDATION
  ==============
*/

</script>
</body>
</html>
